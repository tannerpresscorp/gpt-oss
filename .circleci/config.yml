version: 2.1

jobs:
  validate:
    docker:
      - image: cimg/node:22.19
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ arch }}-{{ checksum "package-lock.json" }}
            - npm-v1-{{ arch }}-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-v1-{{ arch }}-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Test
          command: npm test
      - run:
          name: Type-check
          command: npm run typecheck
      - run:
          name: Build
          command: npm run build

workflows:
  pull-request-validation:
    jobs:
      - validate
