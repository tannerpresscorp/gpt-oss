name: got-oss

services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.11.4}
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
      TZ: ${TZ:-UTC}
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  open-webui:
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.6.35}
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in .env}
      WEBUI_AUTH: ${WEBUI_AUTH:-true}
      ENABLE_SIGNUP: ${WEBUI_ENABLE_SIGNUP:-false}
      TZ: ${TZ:-UTC}
    volumes:
      - open-webui-data:/app/backend/data
    ports:
      - "127.0.0.1:${OPEN_WEBUI_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.10.1.1}
    profiles: ["vllm"]
    restart: unless-stopped
    command: ["--model", "${VLLM_MODEL:-openai/gpt-oss-20b}", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"
    volumes:
      - vllm-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ollama-models:
  open-webui-data:
  vllm-cache:

