name: GitBook Docs

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".gitbook.yaml"
      - "scripts/validate-docs.mjs"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".gitbook.yaml"
      - "scripts/validate-docs.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-gitbook-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate GitBook structure and links
        run: node scripts/validate-docs.mjs
      - name: Add workflow summary
        run: |
          echo "## GitBook source ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Markdown navigation and local links passed validation." >> "$GITHUB_STEP_SUMMARY"
          echo "GitBook Git Sync publishes main after the space is connected to this repository." >> "$GITHUB_STEP_SUMMARY"
