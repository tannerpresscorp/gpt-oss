name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        env:
          WEBUI_SECRET_KEY: ci-validation-secret-not-for-production
        run: |
          docker compose config --quiet

      - name: Check documentation
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: |
            README.md
            docs/**/*.md

      - name: Check workflow security
        uses: zizmorcore/zizmor-action@v0.1.3
